name: PR Quality Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Lint Check
        run: npm run lint
      # 将来的に追加するフロー
      # - name: Run Unit Tests
      #   run: npm run test
      # - name: Run E2E Tests
      #   run: npm run test:e2e
      - name: Run Build Check
        run: npm run build
